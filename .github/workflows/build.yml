name: 编译 X3500 固件

on:
  schedule:
    # 每周日 15:00 UTC（新西兰时间周一凌晨）
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游和本仓库都没有更新，也重新编译'
        type: boolean
        default: false
      openwrt_ref:
        description: 'OpenWrt 分支或标签'
        type: string
        default: openwrt-24.10
  push:
    branches: [main]
    paths:
      - 'openwrt-x3500/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-firmware
  cancel-in-progress: false

env:
  OPENWRT_REF: ${{ inputs.openwrt_ref || 'openwrt-24.10' }}

jobs:
  check:
    name: 检查是否需要编译
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.cmp.outputs.build }}
    steps:
      - name: 比较上游版本和上一次发布
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          url=https://github.com/openwrt/openwrt.git
          upstream=$(git ls-remote "$url" "refs/heads/$OPENWRT_REF" | cut -f1)
          # 标签：优先取 ^{}（附注标签指向的提交）
          [ -n "$upstream" ] || upstream=$(git ls-remote "$url" "refs/tags/$OPENWRT_REF^{}" | cut -f1)
          [ -n "$upstream" ] || upstream=$(git ls-remote "$url" "refs/tags/$OPENWRT_REF" | cut -f1)
          [ -n "$upstream" ] || { echo "找不到 OpenWrt 的 $OPENWRT_REF"; exit 1; }
          echo "上游 $OPENWRT_REF：$upstream"

          last=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          build=true
          if printf '%s' "$last" | grep -q "OpenWrt 提交：$upstream" &&
             printf '%s' "$last" | grep -q "X3500 仓库提交：$GITHUB_SHA"; then
            echo "上一次发布已经是这个版本"
            build=false
          fi
          if [ "$FORCE" = "true" ]; then
            echo "手动要求强制编译"
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: 编译并发布
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 腾出磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - uses: actions/checkout@v4

      - name: 恢复源码包缓存
        uses: actions/cache@v4
        with:
          path: dl-cache
          key: dl-${{ github.run_id }}
          restore-keys: dl-

      - name: 编译
        env:
          WORKDIR: ${{ github.workspace }}/openwrt
          OUTDIR: ${{ github.workspace }}/out
          DL_CACHE: ${{ github.workspace }}/dl-cache
        run: openwrt-x3500/scripts/ci-build.sh

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(sed -n 's/^OpenWrt 提交：//p' out/build-info.txt)
          tag="x3500-$(date -u +%Y%m%d)-${commit:0:7}-${{ github.run_number }}"
          {
            echo '```'
            cat out/build-info.txt
            echo '```'
            echo
            echo '### 升级（已经刷过 OpenWrt 的 X3500）'
            echo '网页 http://192.168.2.1 → 系统 → 备份/升级 → 刷写新的固件，'
            echo '选择 `openwrt-bmips-bcm6362-linksys_x3500-squashfs-sysupgrade.bin`，勾选"保留当前配置"。'
            echo
            echo '### 文件'
            echo '- `*-squashfs-sysupgrade.bin`：在 OpenWrt 里升级用'
            echo '- `*-squashfs-cfe.bin`：从原厂固件或 CFE 网页恢复页面刷入用'
            echo '- `*-initramfs.elf`：用 CFE 的 `r` 命令加载到内存试运行，不写闪存'
            echo '- `sha256sums`：校验值'
            echo
            echo '没有任何担保，刷机风险自负。'
          } > notes.md
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "X3500 固件 $(date -u +%Y-%m-%d)（OpenWrt ${OPENWRT_REF} ${commit:0:7}）" \
            --notes-file notes.md
